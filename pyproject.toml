[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-job-research"
version = "0.1.0"
description = "Local company research and job discovery for an existing Obsidian tracker"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "markdownify>=0.13,<2",
  "playwright>=1.48,<2",
  "PyYAML>=6,<7",
  "trafilatura>=1.12,<3",
]

[project.scripts]
job-research = "job_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

